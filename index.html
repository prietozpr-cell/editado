<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bacano World</title>
  <style>
    :root {
      --bg-color: #0b0b0b;
      --card-bg: #141414;
      --accent-color: #ffd700;
      --text-color: #ffffff;
      --text-muted: #a0a0a0;
      --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

- {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-main);
      line-height: 1.6;
    }

    /* ESTILOS EXCLUSIVOS PARA EL NUEVO BOTÓN CON LÍNEAS DORADAS ANIMADAS EN EL CONTORNO */
    .fest4-banner-container {
      width: 100%;
      background: rgba(11, 11, 11, 0.98);
      padding: 0.8rem 1rem;
      text-align: center;
      position: relative;
      z-index: 102;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
    }

    .btn-fest4-animated {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 0.65rem 1.8rem;
      color: #ffd700;
      background: #0d0d0d;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 1.5px;
      text-decoration: none;
      text-transform: uppercase;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(0, 0, 0, 0.8);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    /* Borde / Líneas doradas giratorias alrededor del contorno */
    .btn-fest4-animated::before {
      content: '';
      position: absolute;
      width: 250%;
      height: 250%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 160deg,
        #b8860b 190deg,
        #ffd700 220deg,
        #fff8dc 240deg,
        #ffd700 260deg,
        #b8860b 280deg,
        transparent 310deg,
        transparent 360deg
      );
      animation: rotateGoldenBorder 3s linear infinite;
      z-index: 1;
    }

    /* Fondo interno para cubrir el centro y dejar únicamente el contorno dorado animado */
    .btn-fest4-animated::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: linear-gradient(135deg, #181507 0%, #0a0a0a 100%);
      border-radius: 48px;
      z-index: 2;
      transition: background 0.3s ease;
    }

    /* Texto con efecto metálico por encima de la animación */
    .btn-fest4-text {
      position: relative;
      z-index: 3;
      background: linear-gradient(180deg, #ffffff 0%, #ffd700 70%, #cca000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
      white-space: nowrap;
    }

    .btn-fest4-animated:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
    }

    .btn-fest4-animated:hover::after {
      background: linear-gradient(135deg, #241f0a 0%, #121212 100%);
    }

    @keyframes rotateGoldenBorder {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background: rgba(11, 11, 11, 0.9);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .navbar .logo {
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    /* Hero Section */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem 2rem 1.5rem;
      min-height: 70vh;
    }

    .hero-banner {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      padding: 1.2rem 1.8rem;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      max-width: 500px;
      width: 100%;
    }

    .hero-banner h2 {
      color: var(--accent-color);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .profile-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-color);
      margin-bottom: 1.5rem;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
    }

    /* Botones General */
    .btn-primary {
      display: inline-block;
      background-color: var(--accent-color);
      color: #000;
      padding: 0.9rem 2.2rem;
      border-radius: 50px;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
    }

    /* Secciones Generales */
    section {
      padding: 4rem 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    section h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--accent-color);
      text-transform: uppercase;
    }

    .section-desc {
      text-align: center;
      color: var(--text-muted);
      max-width: 750px;
      margin: 0 auto 2.5rem auto;
      font-size: 1.05rem;
    }

    /* Sobre Nosotros */
    .about-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2.5rem;
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .about-content {
      flex: 1 1 300px;
    }

    .about-content p {
      font-size: 1.15rem;
      color: var(--text-color);
      line-height: 1.7;
    }

    .about-image-wrapper {
      flex: 1 1 300px;
      display: flex;
      justify-content: center;
    }

    .about-img {
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 12px;
      object-fit: cover;
    }

    /* Sección Spotify */
    .spotify-section {
      text-align: center;
      padding: 2rem 1.5rem 4rem 1.5rem;
    }

    .spotify-card {
      background-color: var(--card-bg);
      padding: 3rem 2rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      max-width: 650px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .spotify-card p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .btn-spotify {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--accent-color);
      color: #000;
      padding: 1rem 2.5rem;
      border-radius: 50px;
      font-weight: 800;
      font-size: 1.05rem;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 0.5rem;
    }

    .btn-spotify:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
    }

    /* Sección Premios */
    .prizes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }

    .prize-card {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .prize-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 215, 0, 0.3);
    }

    .prize-card h3 {
      font-size: 1.4rem;
      color: var(--accent-color);
      margin-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
    }

    .prize-card ul {
      list-style: none;
    }

    .prize-card ul li {
      margin-bottom: 0.8rem;
      position: relative;
      padding-left: 1.2rem;
      color: var(--text-color);
    }

    .prize-card ul li::before {
      content: "•";
      color: var(--accent-color);
      font-weight: bold;
      position: absolute;
      left: 0;
    }

    /* Sponsors */
    .sponsors-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3rem;
      flex-wrap: wrap;
    }

    .sponsor-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 220px;
      height: 120px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sponsor-logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .sponsor-logo:hover {
      transform: scale(1.05);
    }

    /* Nuestra Trayectoria */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      text-align: center;
    }

    .stat-item {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-item h3 {
      font-size: 2.3rem;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
      font-weight: 800;
    }

    .stat-item p {
      color: var(--text-muted);
    }

    /* Formulario de Contacto */
    .contact-container {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 700px;
      margin: 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .contact-notice {
      text-align: center;
      color: var(--accent-color);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      max-width: 700px;
      margin: 0 auto 1.5rem auto;
      padding: 0.8rem 1rem;
      background: rgba(255, 215, 0, 0.05);
      border: 1px dashed rgba(255, 215, 0, 0.3);
      border-radius: 8px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: var(--text-color);
    }

    .form-group input,
    .form-group textarea {
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent-color);
    }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background-color: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.2s ease;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 1.8rem;
      }
      .about-container {
        padding: 1.5rem;
      }
      .btn-fest4-animated {
        font-size: 0.8rem;
        padding: 0.55rem 1.4rem;
      }
    }
  </style>
</head>
